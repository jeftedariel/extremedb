<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExtremeTech · Rastreador de Precios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="styles.css?v=3" />
    <link rel="icon" href="assets/favicon.png" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" onclick="location.hash=''">
        <img src="assets/logo.png" alt="ExtremeTech" />
        <span class="brand-sub">Price Tracker</span>
      </div>
      <div class="search">
        <input
          id="search"
          type="search"
          placeholder="Buscar producto, marca o SKU…"
          autocomplete="off"
        />
      </div>
      <div class="sortbox">
        <select id="sort">
          <option value="updated">Actualizados recientemente</option>
          <option value="name">Nombre (A–Z)</option>
          <option value="price_asc">Precio: menor a mayor</option>
          <option value="price_desc">Precio: mayor a menor</option>
          <option value="discount">Mayor descuento</option>
        </select>
      </div>
      <nav class="toplinks">
        <a href="https://github.com/jeftedariel/extremedb" target="_blank" rel="noopener" title="Código en GitHub" aria-label="GitHub">
          <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
          </svg>
        </a>
        <a href="https://mendozac.cr" target="_blank" rel="noopener" title="mendozac.cr" aria-label="Sitio web de Jefte">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="9.2"/>
            <path d="M2.8 12h18.4M12 2.8c2.6 2.5 3.9 5.7 3.9 9.2s-1.3 6.7-3.9 9.2c-2.6-2.5-3.9-5.7-3.9-9.2s1.3-6.7 3.9-9.2Z"/>
          </svg>
        </a>
      </nav>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h3>Categorías</h3>
        <ul id="categories" class="cats"></ul>
      </aside>

      <main class="content">
        <div id="resultbar" class="resultbar"></div>
        <section id="grid" class="grid"></section>
        <div id="pager" class="pager"></div>
      </main>
    </div>

    <!-- Detalle -->
    <div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeDetail()">
      <div class="detail" id="detail"></div>
    </div>

    <script src="app.js?v=2"></script>
  </body>
</html>
